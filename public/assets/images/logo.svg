<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Lightning bolt -->
  <path
    d="M292 76 L160 296 L244 296 L220 436 L360 216 L268 216 Z"
    fill="url(#bolt)"
    filter="url(#shadow)"
  />

  <!-- Small spark dots -->
  <circle cx="120" cy="120" r="6" fill="rgba(255,255,255,0.35)"/>
  <circle cx="400" cy="140" r="4" fill="rgba(255,255,255,0.3)"/>
  <circle cx="380" cy="400" r="5" fill="rgba(255,255,255,0.25)"/>
</svg>
